<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 610" width="1290" height="610" role="img" aria-labelledby="t d">
<title id="t">realtime-agentic-site-builder topology</title>
<desc id="d">Clients reach an authenticated WebSocket gateway and REST ingress, which command a session hub. The hub applies lock-checked RFC 6902 deltas from the LangGraph swarm and cursor frames from the simulation ticker, and fans events out through per-client listener lanes to the gateway and through an event bus to other workers. Canvas clients get frames from a per-connection compositor, and the export route feeds the latest snapshot to the synthesis engine.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<style>
.box { fill: #111827; stroke: #334155; stroke-width: 1; }
.title { fill: #F1F5F9; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
.body { fill: #94A3B8; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
.edge { fill: #CBD5E1; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
.wire { fill: none; stroke: #94A3B8; stroke-width: 1.5; }
.head { fill: #E5E7EB; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
.sub { fill: #64748B; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</defs>
<rect width="1290" height="610" rx="14" fill="#0B0F19"/>
<text x="30" y="44" class="head">Gateway pipeline and event mesh</text>
<text x="30" y="66" class="sub">Clients</text><text x="320" y="66" class="sub">Gateway</text><text x="650" y="66" class="sub">Session core</text><text x="1010" y="66" class="sub">Agents</text>
<path d="M 260 136 L 320 136" class="wire" marker-end="url(#head)"/><path d="M 260 232 L 320 232" class="wire" marker-end="url(#head)"/><path d="M 260 386 L 320 386" class="wire" marker-end="url(#head)"/><path d="M 590 228 L 650 228" class="wire" marker-end="url(#head)"/><text x="594" y="220" class="edge">commands</text><path d="M 590 358 L 650 358" class="wire" marker-end="url(#head)"/><path d="M 650 140 L 590 140" class="wire" marker-end="url(#head)"/><text x="600" y="132" class="edge">events</text><path d="M 800 216 L 800 196" class="wire" marker-end="url(#head)"/><text x="808" y="211" class="edge">fan-out</text><path d="M 455 240 L 455 258" class="wire" marker-end="url(#head)"/><path d="M 1010 269 L 950 269" class="wire" marker-end="url(#head)"/><text x="957" y="261" class="edge">deltas</text><path d="M 1010 356 L 950 356" class="wire" marker-end="url(#head)"/><text x="957" y="348" class="edge">frames</text><path d="M 800 366 L 800 500" class="wire" marker-end="url(#head)"/><text x="808" y="438" class="edge">publish</text><path d="M 950 540 L 1010 540" class="wire" stroke-dasharray="6 5" marker-end="url(#head)"/><path d="M 455 470 L 455 500" class="wire" marker-end="url(#head)"/><text x="463" y="490" class="edge">export</text>
<rect x="30" y="90" width="230" height="92" rx="10" class="box"/><rect x="30" y="90" width="4" height="92" rx="2" fill="#8B5CF6"/><text x="44" y="114" class="title">Owner client</text><text x="44" y="134" class="body">rasb.v1 WebSocket</text><text x="44" y="151" class="body">prompt · lock · delta · presence</text><rect x="30" y="202" width="230" height="92" rx="10" class="box"/><rect x="30" y="202" width="4" height="92" rx="2" fill="#06B6D4"/><text x="44" y="226" class="title">Canvas viewer</text><text x="44" y="246" class="body">GET /canvas/{id}: static, strict CSP</text><text x="44" y="263" class="body">WS ?view=canvas · read only</text><rect x="30" y="340" width="230" height="92" rx="10" class="box"/><rect x="30" y="340" width="4" height="92" rx="2" fill="#3B82F6"/><text x="44" y="364" class="title">REST client</text><text x="44" y="384" class="body">Bearer token</text><text x="44" y="401" class="body">sessions · timeline · export</text><rect x="320" y="90" width="270" height="150" rx="10" class="box"/><rect x="320" y="90" width="4" height="150" rx="2" fill="#3B82F6"/><text x="334" y="114" class="title">WebSocket gateway</text><text x="334" y="134" class="body">Token in rasb.token.* subprotocol</text><text x="334" y="151" class="body">Owner-only: prompt · lock · delta</text><text x="334" y="168" class="body">Token bucket · heartbeat · expiry</text><text x="334" y="185" class="body">Catch-up deadline, then 1008</text><text x="334" y="202" class="body">Resume from last_seen_thought_seq</text><rect x="320" y="258" width="270" height="78" rx="10" class="box"/><rect x="320" y="258" width="4" height="78" rx="2" fill="#06B6D4"/><text x="334" y="282" class="title">Canvas compositor</text><text x="334" y="302" class="body">Per canvas client: dead reckoning,</text><text x="334" y="319" class="body">dock anchors and lock overlays</text><rect x="320" y="354" width="270" height="116" rx="10" class="box"/><rect x="320" y="354" width="4" height="116" rx="2" fill="#3B82F6"/><text x="334" y="378" class="title">REST ingress</text><text x="334" y="398" class="body">Body limit before parsing</text><text x="334" y="415" class="body">Bearer token, verified identity</text><text x="334" y="432" class="body">RFC 9457 problem documents</text><rect x="650" y="90" width="300" height="106" rx="10" class="box"/><rect x="650" y="90" width="4" height="106" rx="2" fill="#8B5CF6"/><text x="664" y="114" class="title">Listener lanes (per client)</text><text x="664" y="134" class="body">State and locks: bounded queue</text><text x="664" y="151" class="body">Thoughts: lossless, in order</text><text x="664" y="168" class="body">Cursors and presence: conflated</text><rect x="650" y="216" width="300" height="150" rx="10" class="box"/><rect x="650" y="216" width="4" height="150" rx="2" fill="#8B5CF6"/><text x="664" y="240" class="title">SwarmSessionHub</text><text x="664" y="260" class="body">PatchEngine: RFC 6902, AST-checked</text><text x="664" y="277" class="body">Path-level two-phase locking</text><text x="664" y="294" class="body">Deadlocks broken by rank</text><text x="664" y="311" class="body">Replay log, bundle hash per frame</text><text x="664" y="328" class="body">Thought backlog with sequence numbers</text><text x="664" y="345" class="body">Frame pump at broadcast_fps</text><rect x="1010" y="90" width="250" height="106" rx="10" class="box"/><rect x="1010" y="90" width="4" height="106" rx="2" fill="#F59E0B"/><text x="1024" y="114" class="title">Lock priority</text><text x="1024" y="134" class="body">Architect 90 · Owner 80</text><text x="1024" y="151" class="body">Backend 70 · Coder 60</text><text x="1024" y="168" class="body">Copywriter 50 · Styler 40 · Critic 30</text><rect x="1010" y="216" width="250" height="106" rx="10" class="box"/><rect x="1010" y="216" width="4" height="106" rx="2" fill="#10B981"/><text x="1024" y="240" class="title">LangGraph swarm</text><text x="1024" y="260" class="body">planner, then coder and backend,</text><text x="1024" y="277" class="body">then styler, then critic and retry</text><text x="1024" y="294" class="body">Tiered LLM provider</text><rect x="1010" y="342" width="250" height="80" rx="10" class="box"/><rect x="1010" y="342" width="4" height="80" rx="2" fill="#EC4899"/><text x="1024" y="366" class="title">Simulation ticker</text><text x="1024" y="386" class="body">Bézier cursor motion</text><text x="1024" y="403" class="body">Obstacle-aware routing</text><rect x="320" y="500" width="270" height="80" rx="10" class="box"/><rect x="320" y="500" width="4" height="80" rx="2" fill="#10B981"/><text x="334" y="524" class="title">Synthesis engine</text><text x="334" y="544" class="body">Reads the latest snapshot</text><text x="334" y="561" class="body">Deterministic ZIP or tar.gz</text><rect x="650" y="500" width="300" height="80" rx="10" class="box"/><rect x="650" y="500" width="4" height="80" rx="2" fill="#F59E0B"/><text x="664" y="524" class="title">Event bus</text><text x="664" y="544" class="body">In-memory, or Redis Pub/Sub</text><text x="664" y="561" class="body">Fan-out to replica workers</text><rect x="1010" y="500" width="250" height="80" rx="10" class="box"/><rect x="1010" y="500" width="4" height="80" rx="2" fill="#F59E0B"/><text x="1024" y="524" class="title">Other workers</text><text x="1024" y="544" class="body">Adopt state as replicas</text><text x="1024" y="561" class="body">Deduplicate thoughts by seq</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 556" width="1280" height="556" role="img" aria-labelledby="t d">
<title id="t">Lock contention matrix</title>
<desc id="d">Eight steps through the real lock manager. Three agents queue for a component an owner holds. On release it passes to the highest priority waiter, the Architect. The Coder then takes the title, the Architect asks for it, and the wait cycle is broken by preempting the lower ranked Coder, which loses everything it held or waited for.</desc>
<style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }</style>
<rect width="1280" height="556" rx="14" fill="#0B0F19"/>
<text x="30.0" y="40.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="start">Two-phase locking under contention</text>
<text x="30.0" y="62.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Each cell is the real lock table after the step above it. Priority decides who is promoted next and who gives way in a deadlock. It never takes a lock from a live holder.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img" aria-labelledby="t d">
<title id="t">Time travel and reality forking</title>
<desc id="d">A session of 20 commits on the real hub, forked at frame 11. The fork shares frames 0 to 11 with its source by reference, 12 frames and 29,149 bytes of canonical state, none of it copied, then commits 3 frames of its own while the source stays unchanged. Below, the scrubber rebuilds frame 18 from the checkpoint at frame 16 plus 2 patch replays.</desc>
<style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }</style>
<rect width="1280" height="610" rx="14" fill="#0B0F19"/>
<text x="30.0" y="40.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="start">Time travel and reality forking</text>
<text x="30.0" y="62.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Measured on the real hub: a 20-commit session forked at frame 11. Frames are immutable, so a fork costs a reference per frame, not a copy.</text>

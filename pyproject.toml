[project]
name = "realtime-agentic-site-builder"
version = "0.1.0"
description = "Asynchronous, real-time multi-agent site builder and swarm simulation gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "redis[hiredis]>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-socket>=0.7.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_agentic_site_builder"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = "./.cache/pytest/"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --allow-unix-socket: asyncio's event loop needs a local socketpair; AF_INET/AF_INET6 stay blocked.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--disable-socket",
    "--allow-unix-socket",
]

[tool.coverage.run]
branch = true
source = ["realtime_agentic_site_builder"]
data_file = "./.cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.html]
directory = "./.cache/coverage/html"

[tool.coverage.json]
output = "./.cache/coverage/coverage.json"

[tool.coverage.xml]
output = "./.cache/coverage/coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "./.cache/ruff/"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "./.cache/mypy/"
disallow_untyped_defs = true
warn_return_any = true
strict_equality = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = [".cache", ".venv", "tests"]
